<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#F4F6FB" id="themeColorMeta">
    <title>ERP 风险溢价 - 投资助手</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg-color: #F4F6FB;
            --bg-accent: radial-gradient(circle at top left, rgba(66, 153, 225, 0.16), transparent 32%), radial-gradient(circle at top right, rgba(14, 165, 233, 0.12), transparent 26%);
            --card-bg: rgba(255, 255, 255, 0.92);
            --text-main: #111827;
            --text-secondary: #667085;
            --text-tertiary: #B8C0CC;
            --primary-blue: #247CFF;
            --ios-sep: rgba(148, 163, 184, 0.22);
            --stroke-soft: rgba(148, 163, 184, 0.18);
            --shadow-soft: 0 14px 32px rgba(15, 23, 42, 0.06);
            --green: #10B981;
            --red: #EF4444;
            --yellow: #F59E0B;
        }

        :root[data-theme='dark'] {
            --bg-color: #07111F;
            --bg-accent: radial-gradient(circle at top left, rgba(37, 99, 235, 0.24), transparent 30%), radial-gradient(circle at top right, rgba(8, 145, 178, 0.18), transparent 24%);
            --card-bg: rgba(15, 23, 42, 0.86);
            --text-main: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-tertiary: #475569;
            --primary-blue: #60A5FA;
            --ios-sep: rgba(71, 85, 105, 0.45);
            --stroke-soft: rgba(71, 85, 105, 0.32);
            --shadow-soft: 0 18px 40px rgba(2, 8, 23, 0.34);
            --green: #34D399;
            --red: #F87171;
            --yellow: #FBBF24;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; -webkit-user-select: none; }

        html, body {
            overscroll-behavior-y: none;
            background-color: var(--bg-color);
            margin: 0; padding: 0;
        }

        html[data-theme='light'] { color-scheme: light; background-color: #F4F6FB; }
        html[data-theme='dark'] { color-scheme: dark; background-color: #07111F; }

        body {
            font-family: -apple-system, "SF Pro Display", "SF Pro Text", "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: var(--bg-accent);
            background-attachment: fixed;
            padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
            transition: background-color 0.35s ease, color 0.35s ease;
        }

        .container { width: 100%; max-width: 1200px; }

        .header {
            display: flex; align-items: center; gap: 16px;
            padding: 20px 0 12px;
        }
        .back-btn {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--stroke-soft);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 18px; color: var(--text-main);
            text-decoration: none; transition: transform 0.2s ease;
        }
        .back-btn:active { transform: scale(0.9); }
        .header-title { font-size: 22px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; }

        /* KPI 卡片 */
        .kpi-row {
            display: flex; gap: 10px; margin-bottom: 14px;
        }
        .kpi-card {
            flex: 1; background: var(--card-bg);
            border-radius: 16px; padding: 14px 12px;
            border: 1px solid var(--stroke-soft);
            box-shadow: var(--shadow-soft);
            text-align: center;
        }
        .kpi-label { font-size: 11px; color: var(--text-secondary); font-weight: 600; letter-spacing: 0.06em; margin-bottom: 4px; }
        .kpi-value { font-size: 22px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; }
        .kpi-sub { font-size: 10px; color: var(--text-tertiary); margin-top: 2px; }

        .kpi-pe .kpi-value { color: var(--green); }
        .kpi-bond .kpi-value { color: var(--red); }
        .kpi-erp .kpi-value { color: var(--primary-blue); }
        .kpi-erp.positive .kpi-value { color: var(--green); }
        .kpi-erp.negative .kpi-value { color: var(--red); }

        /* 图表 */
        /* 日期筛选按钮 */
        .filter-row {
            display: flex; gap: 8px; flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .filter-btn {
            padding: 6px 14px; border-radius: 999px;
            border: 1px solid var(--stroke-soft);
            background: var(--card-bg); color: var(--text-secondary);
            font-size: 12px; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-btn:active { transform: scale(0.96); }
        .filter-btn.active {
            background: var(--primary-blue); color: #fff;
            border-color: var(--primary-blue);
        }

        .chart-card {
            background: var(--card-bg);
            border-radius: 16px; padding: 12px 8px 8px;
            border: 1px solid var(--stroke-soft);
            box-shadow: var(--shadow-soft);
            margin-bottom: 14px;
        }
        .chart-title {
            font-size: 14px; font-weight: 700; color: var(--text-main);
            padding: 0 8px 4px;
        }
        .chart-wrap { width: 100%; height: 460px; }

        .chart-wrap-sm { height: 320px; }

        /* 解读 */
        .insight-card {
            background: var(--card-bg);
            border-radius: 16px; padding: 14px 16px;
            border: 1px solid var(--stroke-soft);
            box-shadow: var(--shadow-soft);
            margin-bottom: 24px;
        }
        .insight-title { font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
        .insight-text { font-size: 13px; color: var(--text-secondary); line-height: 1.7; }

        /* Loading */
        .loading {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 60px 0; color: var(--text-secondary); font-size: 13px;
        }
        .spinner {
            width: 32px; height: 32px; border: 3px solid var(--stroke-soft);
            border-top-color: var(--primary-blue); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Theme btn */
        .header-right { margin-left: auto; }
        .theme-btn {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--card-bg); border: 1px solid var(--stroke-soft);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s ease;
        }
        .theme-btn:active { transform: scale(0.9); }
        .theme-btn svg { width: 16px; height: 16px; stroke: var(--text-main); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        .footer-note {
            text-align: center; color: var(--text-secondary); font-size: 11px; padding: 0 20px 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-btn">←</a>
            <span class="header-title">ERP 风险溢价</span>
            <div class="header-right">
                <div class="theme-btn" onclick="toggleTheme()" id="themeBtn">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2.5M12 19v2.5M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2.5 12H5M19 12h2.5M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"></path></svg>
                </div>
            </div>
        </div>

        <div id="indicators" class="kpi-row">
            <div class="kpi-card kpi-index"><div class="kpi-label">沪深300</div><div class="kpi-value">--</div><div class="kpi-sub">指数点位</div></div>
            <div class="kpi-card kpi-pe"><div class="kpi-label">PE</div><div class="kpi-value">--</div><div class="kpi-sub">TTM 市盈率</div></div>
            <div class="kpi-card kpi-bond"><div class="kpi-label">十年期国债</div><div class="kpi-value">--%</div><div class="kpi-sub">到期收益率</div></div>
            <div class="kpi-card kpi-erp"><div class="kpi-label">ERP</div><div class="kpi-value">--%</div><div class="kpi-sub">E/P − 国债</div></div>
        </div>

        <div id="loadingEl" class="loading">
            <div class="spinner"></div>
            <span>正在加载数据...</span>
        </div>

        <div id="mainContent" style="display:none;">
            <div class="filter-row">
                <button class="filter-btn active" data-range="0">全部</button>
                <button class="filter-btn" data-range="1">近 1 年</button>
                <button class="filter-btn" data-range="2">近 2 年</button>
                <button class="filter-btn" data-range="3">近 3 年</button>
                <button class="filter-btn" data-range="5">近 5 年</button>
                <button class="filter-btn" data-range="10">近 10 年</button>
            </div>

            <div class="chart-card">
                <div class="chart-title">📈 ERP 风险溢价 + 沪深300 指数</div>
                <div class="chart-wrap" id="erpChart"></div>
            </div>

            <div class="chart-card">
                <div class="chart-title">📊 市盈率 vs 国债收益率</div>
                <div class="chart-wrap chart-wrap-sm" id="peBondChart"></div>
            </div>

            <div class="filter-row">
                <button class="filter-btn turnover-filter active" data-range="0">全部</button>
                <button class="filter-btn turnover-filter" data-range="1">近 1 年</button>
                <button class="filter-btn turnover-filter" data-range="2">近 2 年</button>
                <button class="filter-btn turnover-filter" data-range="3">近 3 年</button>
                <button class="filter-btn turnover-filter" data-range="5">近 5 年</button>
            </div>

            <div class="chart-card">
                <div class="chart-title">💰 A股成交额 + 上证指数</div>
                <div class="chart-wrap" id="turnoverChart"></div>
            </div>

            <div class="insight-card" id="insightCard">
                <div class="insight-title">💡 当前解读</div>
                <div class="insight-text" id="insightText"></div>
            </div>
        </div>

        <p class="footer-note">ERP = 1/PE − 10年期国债收益率  |  成交额为新浪成交量估算(±10%误差)<br>数据来源：乐股乐股 · 中国10年期国债 · 新浪财经</p>
    </div>

    <script>
        const html = document.documentElement;
        const themeBtn = document.getElementById('themeBtn');
        const sunIcon = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2.5M12 19v2.5M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2.5 12H5M19 12h2.5M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"></path></svg>';
        const moonIcon = '<svg viewBox="0 0 24 24"><path d="M20 15.2A7.9 7.9 0 0 1 8.8 4 8.8 8.8 0 1 0 20 15.2z"></path></svg>';

        function updateThemeUI(theme) {
            html.setAttribute('data-theme', theme);
            document.getElementById('themeColorMeta').setAttribute('content', theme === 'dark' ? '#07111F' : '#F4F6FB');
            html.style.backgroundColor = theme === 'dark' ? '#07111F' : '#F4F6FB';
            themeBtn.innerHTML = theme === 'dark' ? sunIcon : moonIcon;
        }

        function toggleTheme() {
            const t = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            updateThemeUI(t);
            localStorage.setItem('theme', t);
            // 刷新图表主题
            if (window._erpChart) { window._erpChart.dispose(); initERPChart(); }
            if (window._peBondChart) { window._peBondChart.dispose(); initPEBondChart(); }
            if (window._turnoverChart) { window._turnoverChart.dispose(); initTurnoverChart(); }
        }

        // 初始化主题
        const saved = localStorage.getItem('theme');
        const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        updateThemeUI(saved || (sysDark ? 'dark' : 'light'));

        function isDark() { return html.getAttribute('data-theme') === 'dark'; }

        const styles = getComputedStyle(document.documentElement);
        function textMain() { return styles.getPropertyValue('--text-main').trim(); }
        function textSec() { return styles.getPropertyValue('--text-secondary').trim(); }
        function textTer() { return styles.getPropertyValue('--text-tertiary').trim(); }
        function colorGreen() { return styles.getPropertyValue('--green').trim(); }
        function colorRed() { return styles.getPropertyValue('--red').trim(); }
        function colorBlue() { return styles.getPropertyValue('--primary-blue').trim(); }
        function strokeSoft() { return styles.getPropertyValue('--stroke-soft').trim(); }

        let erpDataGlobal = [];
        let turnoverDataGlobal = [];
        let currentRange = 0;
        let turnoverRange = 0;

        function getFilteredData() {
            if (currentRange === 0) return erpDataGlobal;
            const now = new Date();
            const cutoff = new Date(now.getFullYear() - currentRange, now.getMonth(), now.getDate());
            const cutoffStr = cutoff.toISOString().slice(0, 10);
            return erpDataGlobal.filter(d => d.date >= cutoffStr);
        }

        function getFilteredTurnoverData() {
            if (turnoverRange === 0) return turnoverDataGlobal;
            const now = new Date();
            const cutoff = new Date(now.getFullYear() - turnoverRange, now.getMonth(), now.getDate());
            const cutoffStr = cutoff.toISOString().slice(0, 10);
            return turnoverDataGlobal.filter(d => d.date >= cutoffStr);
        }

        function refreshCharts() {
            if (window._erpChart) { window._erpChart.dispose(); }
            if (window._peBondChart) { window._peBondChart.dispose(); }
            initERPChart();
            initPEBondChart();
        }

        function initERPChart() {
            const dom = document.getElementById('erpChart');
            const data = getFilteredData();
            if (!dom || !data.length) return;
            const chart = echarts.init(dom);
            window._erpChart = chart;

            const dates = data.map(d => d.date);
            const erpVals = data.map(d => d.erp);
            const closeVals = data.map(d => d.close);

            // 标记 ERP ≈ 6 (±0.2) 红点，ERP ≈ 2 (±0.2) 绿点
            const markRed = data.map(d => (d.erp >= 5.8 && d.erp <= 6.2) ? d.erp : null);
            const markGreen = data.map(d => (d.erp >= 1.8 && d.erp <= 2.2) ? d.erp : null);

            const orangeColor = '#F97316';
            const grayColor = '#9CA3AF';

            const option = {
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: isDark() ? '#1e293b' : '#fff',
                    borderColor: strokeSoft(),
                    textStyle: { color: textMain(), fontSize: 12 },
                    formatter: function(p) {
                        let s = p[0].axisValue + '<br/>';
                        p.forEach(function(item) {
                            if (item.seriesName === 'ERP') s += item.marker + ' ERP: <b>' + item.value + '%</b><br/>';
                            if (item.seriesName === '沪深300') s += item.marker + ' 沪深300: <b>' + item.value.toLocaleString() + '</b><br/>';
                            if (item.seriesName === '≈6' && item.value != null) s += item.marker + ' ERP≈6%<br/>';
                            if (item.seriesName === '≈2' && item.value != null) s += item.marker + ' ERP≈2%<br/>';
                        });
                        return s;
                    }
                },
                grid: { left: 52, right: 72, top: 12, bottom: 24 },
                xAxis: {
                    type: 'category', data: dates,
                    axisLine: { lineStyle: { color: strokeSoft() } },
                    axisLabel: {
                        color: textTer(), fontSize: 10,
                        formatter: v => v.slice(0, 7)
                    },
                    axisTick: { show: false },
                },
                yAxis: [
                    {
                        type: 'value', name: 'ERP %',
                        nameTextStyle: { color: grayColor, fontSize: 10 },
                        axisLabel: { color: grayColor, fontSize: 10 },
                        splitLine: { lineStyle: { color: strokeSoft(), type: 'dashed' } },
                    },
                    {
                        type: 'value', name: '沪深300',
                        nameTextStyle: { color: orangeColor, fontSize: 10 },
                        axisLabel: {
                            color: orangeColor, fontSize: 10,
                            formatter: v => (v / 1000).toFixed(1) + 'k'
                        },
                        splitLine: { show: false },
                    }
                ],
                series: [
                    {
                        name: 'ERP', type: 'line', yAxisIndex: 0,
                        data: erpVals, showSymbol: false, smooth: true,
                        lineStyle: { color: grayColor, width: 1.5 },
                        markLine: {
                            silent: true,
                            data: [{ yAxis: 0, label: { formatter: '0', color: textTer(), fontSize: 10 } }],
                            lineStyle: { color: strokeSoft(), type: 'dashed' }
                        }
                    },
                    {
                        name: '沪深300', type: 'line', yAxisIndex: 1,
                        data: closeVals, showSymbol: false, smooth: true,
                        lineStyle: { color: orangeColor, width: 1.5 },
                    },
                    {
                        name: '≈6', type: 'scatter', yAxisIndex: 0,
                        data: markRed, symbolSize: 5,
                        itemStyle: { color: colorRed() },
                    },
                    {
                        name: '≈2', type: 'scatter', yAxisIndex: 0,
                        data: markGreen, symbolSize: 5,
                        itemStyle: { color: colorGreen() },
                    },
                ]
            };
            chart.setOption(option);
            window.addEventListener('resize', () => chart.resize());
        }

        function initPEBondChart() {
            const dom = document.getElementById('peBondChart');
            const data = getFilteredData();
            if (!dom || !data.length) return;
            const chart = echarts.init(dom);
            window._peBondChart = chart;

            const dates = data.map(d => d.date);
            const peVals = data.map(d => d.pe);
            const bondVals = data.map(d => d.bondYield);

            const option = {
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: isDark() ? '#1e293b' : '#fff',
                    borderColor: strokeSoft(),
                    textStyle: { color: textMain(), fontSize: 12 },
                },
                legend: {
                    data: ['PE', '国债'],
                    textStyle: { color: textTer(), fontSize: 11 },
                    top: 0, right: 8,
                },
                grid: { left: 52, right: 72, top: 28, bottom: 24 },
                xAxis: {
                    type: 'category', data: dates,
                    axisLine: { lineStyle: { color: strokeSoft() } },
                    axisLabel: { color: textTer(), fontSize: 10, formatter: v => v.slice(0, 7) },
                    axisTick: { show: false },
                },
                yAxis: [
                    {
                        type: 'value', name: 'PE',
                        nameTextStyle: { color: textTer(), fontSize: 10 },
                        axisLabel: { color: textTer(), fontSize: 10 },
                        splitLine: { lineStyle: { color: strokeSoft(), type: 'dashed' } },
                    },
                    {
                        type: 'value', name: '%',
                        nameTextStyle: { color: textTer(), fontSize: 10 },
                        axisLabel: { color: textTer(), fontSize: 10 },
                        splitLine: { show: false },
                    }
                ],
                series: [
                    {
                        name: 'PE', type: 'line', yAxisIndex: 0,
                        data: peVals, showSymbol: false,
                        lineStyle: { color: colorGreen(), width: 1.5 },
                        smooth: true,
                    },
                    {
                        name: '国债', type: 'line', yAxisIndex: 1,
                        data: bondVals, showSymbol: false,
                        lineStyle: { color: colorRed(), width: 1.5 },
                        smooth: true,
                    }
                ]
            };
            chart.setOption(option);
            window.addEventListener('resize', () => chart.resize());
        }

        function initTurnoverChart() {
            const dom = document.getElementById('turnoverChart');
            const turnoverData = getFilteredTurnoverData();
            if (!dom || !turnoverData.length) return;
            const chart = echarts.init(dom);
            window._turnoverChart = chart;

            const dates = turnoverData.map(d => d.date);
            const turnovers = turnoverData.map(d => d.turnover);
            const shIndex = turnoverData.map(d => d.shIndex);

            const option = {
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: isDark() ? '#1e293b' : '#fff',
                    borderColor: strokeSoft(),
                    textStyle: { color: textMain(), fontSize: 12 },
                    formatter: function(p) {
                        let s = p[0].axisValue + '<br/>';
                        p.forEach(function(item) {
                            if (item.seriesName === '成交额') s += item.marker + ' 成交额: <b>' + (item.value/10000).toFixed(2) + '万亿</b><br/>';
                            if (item.seriesName === '上证指数') s += item.marker + ' 上证: <b>' + item.value.toLocaleString() + '</b><br/>';
                        });
                        return s;
                    }
                },
                legend: {
                    data: ['成交额', '上证指数'],
                    textStyle: { color: textTer(), fontSize: 11 },
                    top: 0, right: 8,
                },
                grid: { left: 52, right: 72, top: 28, bottom: 24 },
                xAxis: {
                    type: 'category', data: dates,
                    axisLine: { lineStyle: { color: strokeSoft() } },
                    axisLabel: { color: textTer(), fontSize: 10, formatter: v => v.slice(0, 7) },
                    axisTick: { show: false },
                },
                yAxis: [
                    {
                        type: 'value', name: '成交额(亿)',
                        nameTextStyle: { color: '#F97316', fontSize: 10 },
                        axisLabel: { color: '#F97316', fontSize: 10, formatter: v => (v/10000).toFixed(1) + '万亿' },
                        splitLine: { lineStyle: { color: strokeSoft(), type: 'dashed' } },
                    },
                    {
                        type: 'value', name: '上证指数',
                        nameTextStyle: { color: colorRed(), fontSize: 10 },
                        axisLabel: { color: colorRed(), fontSize: 10 },
                        splitLine: { show: false },
                    }
                ],
                series: [
                    {
                        name: '成交额', type: 'line', yAxisIndex: 0,
                        data: turnovers, showSymbol: false, smooth: true,
                        lineStyle: { color: '#F97316', width: 1.5 },
                    },
                    {
                        name: '上证指数', type: 'line', yAxisIndex: 1,
                        data: shIndex, showSymbol: false, smooth: true,
                        lineStyle: { color: colorRed(), width: 1.5 },
                    }
                ]
            };
            chart.setOption(option);
            window.addEventListener('resize', () => chart.resize());
        }

        function updateInsight(latest) {
            const el = document.getElementById('insightText');
            let text = '';
            if (latest.erp > 3) {
                text = `当前 ERP 为 <b>${latest.erp}%</b>，处于较高水平。股票相对债券的吸引力较强，权益类资产配置性价比较高。<br><br>PE=${latest.pe}，国债收益率=${latest.bondYield}%，股价相对便宜。`;
            } else if (latest.erp > 1) {
                text = `当前 ERP 为 <b>${latest.erp}%</b>，处于中等水平。股票相对债券无明显优势，建议均衡配置。<br><br>PE=${latest.pe}，国债收益率=${latest.bondYield}%。`;
            } else if (latest.erp > 0) {
                text = `当前 ERP 为 <b>${latest.erp}%</b>，处于较低水平。股票相对债券吸引力较弱，注意风险控制。<br><br>PE=${latest.pe}，国债收益率=${latest.bondYield}%。`;
            } else {
                text = `当前 ERP 为 <b>${latest.erp}%</b>，已为负值。债券收益率高于股票收益率（E/P），权益资产不具备吸引力。<br><br>PE=${latest.pe}，国债收益率=${latest.bondYield}%。`;
            }
            el.innerHTML = text;
        }

        function renderAll(data) {
            erpDataGlobal = data;
            document.getElementById('loadingEl').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';

            const latest = data[data.length - 1];
            const erpCard = document.querySelector('.kpi-erp');

            document.querySelector('.kpi-index .kpi-value').textContent = latest.close.toLocaleString();
            document.querySelector('.kpi-pe .kpi-value').textContent = latest.pe.toFixed(1);
            document.querySelector('.kpi-bond .kpi-value').textContent = latest.bondYield.toFixed(2) + '%';
            document.querySelector('.kpi-erp .kpi-value').textContent = latest.erp.toFixed(2) + '%';

            erpCard.classList.remove('positive', 'negative');
            if (latest.erp > 0) erpCard.classList.add('positive');
            else if (latest.erp < 0) erpCard.classList.add('negative');

            initERPChart();
            initPEBondChart();
            initTurnoverChart();
            updateInsight(latest);
        }

        async function loadTurnoverData() {
            try {
                const resp = await fetch('/api/market-turnover');
                const json = await resp.json();
                if (json.success) { turnoverDataGlobal = json.data; initTurnoverChart(); }
            } catch (e) { console.error('成交额加载失败:', e); }
        }

        // ERP 日期筛选按钮
        document.querySelectorAll('.filter-btn:not(.turnover-filter)').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn:not(.turnover-filter)').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentRange = parseInt(this.dataset.range);
                if (window._erpChart) { window._erpChart.dispose(); }
                if (window._peBondChart) { window._peBondChart.dispose(); }
                initERPChart();
                initPEBondChart();
            });
        });

        // 成交额日期筛选按钮
        document.querySelectorAll('.turnover-filter').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.turnover-filter').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                turnoverRange = parseInt(this.dataset.range);
                if (window._turnoverChart) { window._turnoverChart.dispose(); }
                initTurnoverChart();
            });
        });

        async function loadData() {
            try {
                const resp = await fetch('/api/erp');
                const json = await resp.json();
                if (!json.success) throw new Error(json.message);
                if (!json.data.length) throw new Error('无数据');
                renderAll(json.data);
                loadTurnoverData();
            } catch (e) {
                document.getElementById('loadingEl').innerHTML =
                    `<div style="color:var(--red);text-align:center;">加载失败: ${e.message}<br><small>请稍后重试</small></div>`;
            }
        }

        loadData();
    </script>
</body>
</html>
